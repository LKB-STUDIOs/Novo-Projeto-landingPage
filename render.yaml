# Render Blueprint: site estático da LBK Studio
# No Render: New → Blueprint → escolha este repositório → Apply.
services:
  - type: web
    name: lbk-studio
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    # todas as rotas do app (ex.: /projetos/ferrus) abrem o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # cabeçalhos de segurança (o GitHub Pages não permite; o Render sim)
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
